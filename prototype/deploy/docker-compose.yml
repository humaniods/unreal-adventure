# One VM runs everything. Needs two DNS names pointing at the VM (GAME_DOMAIN, VOICE_DOMAIN in .env) and open ports:
# 80, 443 (Caddy: HTTPS for the game and for LiveKit signalling), 7881/tcp and 7882/udp (voice media), 3478/udp (TURN).
#   cp env.example .env   # fill it in
#   docker compose up -d --build
services:
  game:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: .env
    environment:
      LIVEKIT_URL: wss://${VOICE_DOMAIN}
      TRIUND_ORIGINS: https://${GAME_DOMAIN}
    volumes: [ "triund-data:/data" ]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: [ "./livekit.yaml:/etc/livekit.yaml:ro" ]
    network_mode: host          # WebRTC media wants the real ports, not Docker NAT
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN}
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data" ]
    restart: unless-stopped

volumes:
  triund-data:
  caddy-data:
