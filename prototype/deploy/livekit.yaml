# LiveKit for the trek's voice (keys come from LIVEKIT_KEYS in docker-compose.yml)
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882          # one UDP port for all media
  use_external_ip: true
turn:
  enabled: true           # players behind Jio/Airtel CGNAT or office firewalls relay through here
  udp_port: 3478
room:
  empty_timeout: 300
  max_participants: 100
logging:
  level: info
