[project]
name = "triund-server"
version = "0.1.0"
description = "Triund multiplayer: Ludo-style rooms, shared 100-player worlds, voice tokens"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "livekit-api>=0.7",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
timeout = 15
